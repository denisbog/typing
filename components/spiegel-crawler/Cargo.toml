[package]
name = "spiegel-crawler"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "extract"
path = "src/extract.rs"
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["json", "blocking"] }
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }


aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = {version = "1.124.0"}
serde_dynamo = {version="4.3.0", features = ["aws-sdk-dynamodb+1"]}
library-version = { path = "../library-version" }
