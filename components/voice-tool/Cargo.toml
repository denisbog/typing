[package]
name = "voice-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104" }
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1.124.0" }
base64 = "0.22"
futures = { version = "0.3.34" }
reqwest = { version = "0.12.28", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = { version = "1.0.151" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
