[package]
name = "article-import"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "article-import"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
article-model = { path = "../article-model" }
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1.124.0" }
clap = { version = "4.6.6", features = ["derive", "env"] }
library-version = { path = "../library-version" }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
